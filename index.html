<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق شنقيط</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4 max-w-xl mx-auto font-sans">
    <h1 class="text-2xl font-bold text-amber-500 text-center my-4">تطبيق شنقيط</h1>
    
    <div class="bg-slate-800 p-4 rounded-xl mb-4 border border-slate-700">
        <label class="block text-sm mb-2 text-amber-400">مفتاح Gemini API:</label>
        <input type="text" id="k" placeholder="ألصق المفتاح هنا" class="w-full p-2 bg-slate-900 border border-slate-600 rounded text-white mb-2" oninput="localStorage.setItem('gemini_key', this.value); document.getElementById('s').innerText='✅ تم الحفظ بنجاح!';">
        <p id="s" class="text-xs text-green-400 text-center"></p>
    </div>

    <script>
        window.onload = function() {
            let saved = localStorage.getItem('gemini_key');
            if(saved) {
                document.getElementById('k').value = saved;
                document.getElementById('s').innerText = '✅ المفتاح محفوظ وجاهز';
            }
        }
    </script>
</body>
</html>
